services:
  postgres:
    image: postgres:17
    container_name: votacao-postgres
    environment:
      POSTGRES_DB: votacao
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: votacao-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/votacao
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      CPF_VALIDACAO_DESATIVADA: "true"
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
